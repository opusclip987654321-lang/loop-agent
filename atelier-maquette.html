ge gold">${esc(t.category)}</span><span class="badge">${esc(t.format||t.type)}</span></div><div class="task-detail-layout"><div class="task-main"><p>${esc(t.goal)}</p><div class="meta"><div><span>Responsable</span>${esc(t.owner)}</div><div><span>Révision prévue</span>${esc(t.reviewCadence||((t.type==='Ponctuelle'||t.format)?'Chaque jour':'Chaque lundi'))}</div><div><span>Critère de réussite</span>${esc(t.metric)}</div><div><span>Plan d’exécution</span>${esc(executionPlan(t.owner))}</div></div></div></div>${youtube}<div class="heading" style="margin:20px 0 8px"><h3>Idées de cette action</h3><div class="actions" style="margin:0">${btn('+ Ajouter mon idée',"newTaskIdea('TID','Walid')".replace('TID',id))}${btn('Simuler une idée proposée par l’IA',"newTaskIdea('TID','IA')".replace('TID',id))}</div></div><p class="note">Les idées de Walid sont approuvées directement. Toute idée ajoutée par l’IA doit être validée ou refusée avec les boutons vert et rouge. Une idée validée peut partir en exécution quand l’IA le décide. Ces idées sont indépendantes. L’agent peut en retenir certaines, en écarter d’autres et les classer par priorité ; aucune idée ne dépend de la validation d’une précédente. Chaque carte affiche le stade le plus récemment atteint. Si une idée repart en boucle de Révision vers Exécution, son stade affiché redevient Exécution ; son parcours précédent reste visible.</p><div id="taskideas-${id}">${ideaList}</div><label>État de l’action</label><select id="taskstatus">${['À planifier',...queueStates,'À valider','Terminée','Bloquée'].map(s=>`<option ${s===t.status?'selected':''}>${esc(s)}</option>`).join('')}</select><label>Ta description ou tes remarques pour l’agent</label><textarea id="taskfeedback" placeholder="Explique ce que tu penses de l’action…">${esc(t.feedback||'')}</textarea><div class="actions">${btn('Enregistrer mon avis',`saveFeedback('${id}')`,'primary')}${btn('Enregistrer le statut',`updateTask('${id}')`)}${btn('Voir l’exécution','closeDialog();go(1)' function updateFollowers(id,value){let n=data.followers.find(x=>x.id===id);if(!n)return;n.current=Number(value||0);save();let gap=Number(n.target)-n.current,pct=n.target?Math.max(0,Math.min(100,n.current/n.target*100)):0,conversion=n.monthlyViews?Number(n.followersGained)/Number(n.monthlyViews)*100:0,vpf=n.followersGained?Number(n.monthlyViews)/Number(n.followersGained):0;document.getElementById('gap-follow-'+id).textContent=gap>0?gap.toLocaleString('fr-FR')+' à franchir':gap===0?'Objectif atteint':'Objectif dépassé de '+Math.abs(gap).toLocaleString('fr-FR');document.getElementById('progress-'+id).style.width=pct+'%';document.getElementById('pct-'+id).textContent=pct.toFixed(1).replace('.',',')+'%';document.getElementById('conv-'+id).textContent=conversion.toFixed(2).replace('.',',')+'%';document.getElementById('vpf-'+id).textContent=vpf.toFixed(1).replace('.',',')+' vues / abonné'}

function recycleContent(sourceId){let source=task(sourceId),title=source?.title||'Vidéo YouTube';modal('Décliner un contenu sur plusieurs réseaux',`<form id="recycleform"><label>Vidéo source</label><input id="recyclesource" value="${esc(title)}" required><p class="note">La tâche est créée pour Instagram Reels, TikTok et YouTube Shorts. L’objectif de la tâche précise les adaptations attendues.</p><div class="actions"><button class="primary">Créer la tâche de recyclage</button></div></form>`);document.getElementById('recycleform').onsubmit=e=>{e.preventDefault();let sourceTitle=document.getElementById('recyclesource').value,id='recycle-'+Date.now();data.tasks.push({id,title:'Recycler une vidéo YouTube en Reels Instagram, TikTok et Shorts',origin:'Walid',owner:'Agent',goal:'Adapter « '+sourceTitle+' » pour Instagram Reels, TikTok et YouTube Shorts.',metric:'3 déclinaisons prêtes et validées',status:'À planifier',type:'Boucle',paused:false,freq:'À chaque vidéo source',category:'Réseaux sociaux',sourceTitle,ideas:[{text:'Sélectionner plusieurs extraits pertinents',latestStage:'Planification',stageHistory:[],agentComment:'',walidReply:''},{text:'Adapter les hooks, sous-titres et cadrages aux formats courts',latestStage:'Planification',stageHistory:[],agentComment:'',walidReply:''},{text:'Présenter les trois déclinaisons à Walid pour validation',latestStage:'Planification',stageHistory:[],agentComment:'',walidReply:''}]});data.priorities.push(id);save();closeDialog();render();notify('Tâche de recyclage ajoutée à la planification.') }}function memory(){return head('Mémoire','Retrouver les enseignements tirés de chaque action du projet.',btn('Règles du projet','editGoldenRules()'))+`<p class="note">Ouvre une action pour consulter ses réussites et ses échecs datés. La mémoire affichée reste propre à ${esc(projectDef.name)}.</p><input placeholder="Rechercher une action ou un enseignement…" value="${esc(window.query||'')}" oninput="searchMemory(this.value)"><div class="grid" id="memoryCards" style="margin-top:18px">${memoryCards()}</div>`}function memoryMatches(m,q){return [m.title,m.text,m.lesson,m.kind,m.tag,m.cycle,m.date].join(' ').toLowerCase().includes(q.toLowerCase())}function isMemorySuccess(m){return ['Réussites','Hooks efficaces'].includes(m.kind)}function isMemoryFailure(m){return ['Échecs','Hooks rejetés'].includes(m.kind)}function memoryRecordMarkup(m,ti,idx){let st=lessonState(m);let cls=st==='confirmée'?'ok':st==='invalidée'?'ko':'';
 let ctrls=(ti!==undefined)?`<div style="margin-top:8px">${LESSON_STATES.map(s=>`<span class="lessonstate ${s===st?(s==='confirmée'?'ok':s==='invalidée'?'ko':''):''}" onclick="setLessonState('${ti}',${idx},'${s}')" style="${s===st?'font-weight:600':'opacity:.55'}">${s}</span>`).join('')}</div>`:'';
 return `<article class="memory-record"><div class="memory-date">${m.date?formatReviewDate(m.date):esc(m.cycle||'Date à préciser')} · ${esc(m.tag||m.kind)} <span class="lessonstate ${cls}">${esc(st)}</span></div><strong>${esc(m.title)}</strong><p class="muted">${esc(m.text)}</p><p class="note">Leçon à réutiliser : ${esc(m.lesson||'À compléter')}</p>${ctrls}</article>`}function memoryCards(){let q=(window.query||'').toLowerCase();return data.tasks.filter(t=>t.proposalStatus!=='pending').filter(t=>{let items=(data.memories||[]).filter(m=>m.taskId===t.id);return !q||t.title.toLowerCase().includes(q)||items.some(m=>memoryMatches(m,q))}).map(t=>{let items=(data.memories||[]).filter(m=>m.taskId===t.id);return `<article class="card"><span class="tiny">ACTION</span><h2>${esc(t.title)}</h2><p class="note">${items.length?items.length+' enseignement(s) mémorisé(s)':'Aucun enseignement mémorisé pour le moment.'}</p><div class="actions">${btn('Ouvrir la mémoire de l’action',`openActionMemory('${t.id}')`,'primary')}</div></article>`}).join('')||'<div class="empty">Aucune action ne correspond à cette recherche.</div>'}function openActionMemory(id){let t=task(id);if(!t)return;let items=(data.memories||[]).filter(m=>m.taskId===id),successes=items.filter(isMemorySuccess),failures=items.filter(isMemoryFailure),other=items.filter(m=>!isMemorySuccess(m)&&!isMemoryFailure);modal('Mémoire de l’action · '+t.title,`<p class="note">${esc(projectDef.name)} · ${esc(t.goal||'Enseignements associés à cette action.')}</p><p class="note">L’agent peut réutiliser ces expériences pour choisir ou ajuster ses prochaines actions.</p><div class="memory-project-grid"><section class="memory-outcome success"><h3>Réussites</h3>${successes.map(m=>memoryRecordMarkup(m,id,items.indexOf(m))).join('')||'<p class="note">Aucune réussite consignée pour cette action.</p>'}</section><section class="memory-outcome failure"><h3>Échecs</h3>${failures.map(m=>memoryRecordMarkup(m,id,items.indexOf(m))).join('')||'<p class="note">Aucun échec consigné pour cette action.</p>'}</section></div>${other.length?`<details class="memory-section"><summary style="cursor:pointer;color:var(--gold)">Autres enseignements (${other.length})</summary>${other.map(m=>memoryRecordMarkup(m,id,items.indexOf(m))).join('')}</details>`:''}`)}function editGoldenRules(){modal('Règles du projet · '+projectDef.name,`<p class="note">Une règle par ligne. Elles restent enregistrées dans la mémoire de ce projet.</p><textarea id="ruleText" style="min-height:180px">${esc(data.rules.join('\n'))}</textarea><div class="actions">${btn('Enregistrer les règles',"data.rules=document.getElementById('ruleText').value.split('\\n').map(x=>x.trim()).filter(Boolean);save();closeDialog();render();notify('Règles mises à jour.')",'primary')}</div>`)}function searchMemory(q){window.query=q;document.getElementById('memoryCards').innerHTML=memoryCards()}function priorities(){return head('Priorités','Choisir l’ordre des actions et les sujets à traiter pour '+projectDef.name+'.')+`${(projectId==='vegebudget'||projectDef.kind==='youtube')?`<section class="card space"><h2>Quota de production quotidien</h2><div class="grid"><div><label>Nombre de Shorts par jour</label><input type="number" min="0" max="20" value="${esc(data.quota)}" oninput="data.quota=this.value;save();document.getElementById('quotaLabel').textContent=this.value+' Short(s) par jour'"></div><div><label>Cadence sélectionnée</label><div class="metric" id="quotaLabel">${esc(data.quota)} Short(s) par jour</div><p class="note">Modifiable selon les ressources et les résultats.</p></div></div></section>`:''}<section class="card space"><h2>Arbitrage des thématiques</h2><p class="note">Réorganise les sujets selon CTR, rétention et abonnements observés dans Vérification.</p>${data.themes.map((th,i)=>`<div class="row"><span class="rank">0${i+1}</span><div class="grow"><strong>${esc(th)}</strong><p class="note">Signal de démonstration : ${esc(data.themeSignals?.[th]||(i===0?'résultat à conf function reviewCadenceFor(t){return t.reviewCadence||((t.type==='Ponctuelle'||t.format)?'Chaque jour':'Chaque lundi')}function reviewResultSummary(t){if(t.reviewResult)return `<p style="white-space:pre-line">${esc(t.reviewResult)}</p>`;if(t.id==='growth-multiplatform'){let f=data.followers||[],target=f.reduce((a,x)=>a+Number(x.target||0),0),current=f.reduce((a,x)=>a+Number(x.current||0),0);return `<strong>${current.toLocaleString('fr-FR')} / ${target.toLocaleString('fr-FR')} abonnés</strong><p>Écart restant : ${Math.max(0,target-current).toLocaleString('fr-FR')}</p>`}if(t.id.startsWith('growth-')){let key=t.id.replace('growth-',''),n=(data.followers||[]).find(x=>x.id===key);if(n){let gap=Math.max(0,Number(n.target)-Number(n.current)),pct=n.target?Math.min(100,Number(n.current)/Number(n.target)*100):0;return `<strong>${Number(n.current).toLocaleString('fr-FR')} / ${Number(n.target).toLocaleString('fr-FR')} abonnés</strong><p>Écart restant : ${gap.toLocaleString('fr-FR')} · ${pct.toFixed(1).replace('.',',')} % de l’objectif</p>`}}if(t.format){return `<div class="metricgrid"><div class="metricbox"><span class="tiny">CTR miniature</span><strong>${esc(t.ctr||'—')}%</strong></div><div class="metricbox"><span class="tiny">Rétention 30 s</span><strong>${esc(t.retention||'—')}%</strong></div><div class="metricbox"><span class="tiny">Durée moyenne</span><strong>${esc(t.avd||'—')}</strong></div></div>`}if(t.actualValue!==undefined&&t.actualValue!==''){return `<strong>${esc(t.actualValue)}</strong><p>${esc(verificationGap(t))}</p>`}return `<p class="muted">Aucun résultat mesuré pour le moment.</p><p class="note">Indicateur attendu : ${esc(t.metric||t.goal)}</p>`}function formatReviewDate(value){let parts=String(value||'').split('-');return parts.length===3?parts[2]+'/'+parts[1]+'/'+parts[0].slice(-2):esc(value||'Date inconnue')}function reviewHistoryMarkup(t){let history=[...(t.reviewHistory||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)));return history.map(entry=>`<article class="card review-entry"><div class="toolbar" style="margin:0 0 8px"><span class="badge gold">${entry.cycle?esc(entry.cycle)+" · ":""}${formatReviewDate(entry.date)}</span><span class="badge blue">Rédigé par l’IA</span></div><span class="tiny">CONSTAT DE L’IA</span><p>${esc(entry.aiObservation||'Aucun constat renseigné.')}</p><span class="tiny">DÉCISION DE L’IA</span><p>${esc(entry.aiDecision||'Poursuivre les idées déjà validées.')}${entry.plan?' · '+esc(entry.plan):''}</p></article>`).join('')||'<p class="note">Aucune revue enregistrée pour le moment. L’historique se remplira lorsque l’IA réalisera sa première revue.</p>'}function reviewTagClass(type){return type==='Erreur de fait / à refaire'?'fact':type==='Changement de stratégie'?'strategy':''}function reviewConversationPanel(t,id){let messages=(t.reviewConversation||[]).map(m=>`<article class="review-entry"><div class="toolbar"><span class="badge ${m.role==='Walid'?'gold':'blue'}">${esc(m.role==='Walid'?'Walid':'IA')}</span><span class="note">${formatReviewDate(m.date)}</span>${m.role==='Walid'&&m.correctionType&&m.correctionType!=='Aucun type particulier'?`<span class="review-tag ${reviewTagClass(m.correctionType)}">${esc(m.correctionType)}</span>`:''}</div><p>${esc(m.text)}</p></article>`).join('')||'<p class="note">Aucun échange pour le moment. Tes messages resteront séparés de l’historique des revues.</p>';return `<section class="card space"><h3>Échange avec l’IA</h3><p class="note">Tu peux poser une question ou demander une correction ici. Ces messages n’ajoutent rien à l’historique des revues.</p><div>${messages}</div><label for="reviewType-${id}">Type de correction</label><select id="reviewType-${id}"><option>Aucun type particulier</option><option>Correction mineure</option><option>Erreur de fait / à refaire</option><option>Changement de stratégie</option></select><p class="note">Ce choix aide l’IA à comprendre l’impact de ta remarque. Il ne déclenche pas automatiquement une nouvelle action.</p><label for="reviewMessage-${id}">Ton message</label><textarea id="reviewMessage-${id}" placeholder="Écris tes remarques ou les corrections que tu demandes à l’IA…"></textarea><div class="actions">${btn('Envoyer à l’IA',`sendReviewMessage('${id}')`)}${stateIsAwaitingWalid(t)?btn('Envoyer et demander une correction',`sendReviewMessage('${id}',true)`):''}</div></section>`}function stateIsAwaitingWalid(t){return (t.reviewState||'')==='En attente de validation par Walid'}function reviewCard(t){let state=t.reviewState||'À examiner par l’agent',latest=[...(t.reviewHistory||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];return `<article class="card"><div class="toolbar" style="margin:0 0 10px">${pill(state)}<span class="badge gold">${esc(reviewCadenceFor(t))}</span><span class="badge">${esc(t.category||'À classer')}</span></div><h2>${esc(t.title)}</h2><p class="muted">Objectif : ${esc(t.goal)}</p><div class="review-result"><span class="tiny">RÉSULTAT ACTUEL</span>${reviewResultSummary(t)}</div>${latest?`<div class="review-entry-preview"><span class="tiny">DERNIER CONSTAT DE L’IA · ${formatReviewDate(latest.date)}</span><p>${esc(latest.aiObservation)}</p></div>`:''}<div class="actions">${btn('Voir le résultat et l’historique',`reviewDetail('${t.id}')`,'primary')}</div></article>`}function reviewDetail(id){let t=task(id);if(!t)return;let state=t.reviewState||'À examiner par l’agent';let controls=state==='En attente de validation par Walid'?`<p class="strip">L’IA a terminé son constat et te soumet son analyse pour validation.</p><div class="actions">${btn('✅ Valider le constat',`walidApproveReview('${id}')`,'good')}</div>`:state==='Validé par Walid'?`<p class="strip">Tu as validé le dernier constat de l’IA.</p>${btn('Lancer une nouvelle revue',`resetReview('${id}')`)}`:state==='Repris en exécution'?`<p class="strip">L’IA a repris cette action en exécution. Le résultat sera examiné de nouveau ensuite.</p>${btn('Relancer la revue',`resetReview('${id}')`)}`:`<p class="strip">L’IA examine le résultat. Elle peut poursuivre les idées déjà approuvées, les modifier librement ou proposer une nouvelle action à valider.</p><div class="actions">${btn('✅ Simuler le constat de l’IA',`agentApproveReview('${id}')`,'good')}${btn('↻ Simuler la reprise en exécution par l’IA',`agentReturnToExecution('${id}')`)}</div>`;modal('Révision · '+t.title,`<div class="toolbar">${pill(state)}<span class="badge gold">${esc(reviewCadenceFor(t))}</span></div><section class="card space"><h3>Objectif de l’action</h3><p>${esc(t.goal)}</p><p class="note">Indicateur : ${esc(t.metric||'À préciser')}</p></section><section class="card space"><h3>Résultat actuel</h3>${reviewResultSummary(t)}<label>Résultat observé</label><textarea id="reviewResult-${id}" oninput="saveReviewResult('${id}',this.value)" placeholder="Résultat ou mesure de l’action…">${esc(t.reviewResult||'')}</textarea></section><section class="card space"><div class="heading"><div><h3>Historique des revues</h3><p class="note">Les constats et décisions de cette liste sont rédigés par l’IA. Tes messages sont conservés à part.</p></div></div>${reviewHistoryMarkup(t)}</section><section class="card space"><label>Prochaine revue</label><select onchange="setReviewCadence('${id}',this.value)"><option ${reviewCadenceFor(t)==='Chaque jour'?'selected':''}>Chaque jour</option><option ${reviewCadenceFor(t)==='Chaque lundi'?'selected':''}>Chaque lundi</option></select></section>${controls}${reviewConversationPanel(t,id)}`)}function saveReviewResult(id,value){let t=task(id);if(t){t.reviewResult=value;save()}}function setReviewCadence(id,value){let t=task(id);if(t){t.reviewCadence=value;save()}}function recordAIReview(t,decision,observation,plan=''){t.reviewHistory=t.reviewHistory||[];t.reviewHistory.unshift({date:new Date().toISOString().slice(0,10),aiObservation:observation,aiDecision:decision,plan})}function agentApproveReview(id){let t=task(id);if(!t)return;let result=(t.reviewResult||'').trim();recordAIReview(t,'L’IA valide le constat et soumet son analyse à Walid',result?'Résultat analysé par l’IA : '+result:'L’IA a examiné le résultat actuel de cette action. Elle estime que les données disponibles permettent de poursuivre le suivi.', 'L’IA recommande de continuer avec les idées déjà approuvées, sauf proposition nouvelle soumise à Walid.');t.reviewState='En attente de validation par Walid';save();reviewDetail(id)}function agentReturnToExecution(id){let t=task(id);if(!t)return;let result=(t.reviewResult||'').trim();recordAIReview(t,'L’IA reprend l’action en exécution',result?'Après analyse du résultat (« '+result+' »), l’IA estime qu’un nouveau passage par l’exécution est nécessaire.':'Après examen, l’IA estime que cette action doit repasser par l’exécution avant une nouvelle revue.');t.reviewState='Repris en exécution';t.status='En cours';save();reviewDetail(id)}function walidApproveReview(id){let t=task(id);if(!t)return;t.reviewState='Validé par Walid';save();reviewDetail(id)}function sendReviewMessage(id,requestCorrection=false){let t=task(id);if(!t)return;let field=document.getElementById('reviewMessage-'+id),typeField=document.getElementById('reviewType-'+id),message=(field?.value||'').trim();if(!message){notify('Écris ton message à l’IA avant de l’envoyer.');return}t.reviewConversation=t.reviewConversation||[];t.reviewConversation.push({role:'Walid',date:new Date().toISOString().slice(0,10),text:message,correctionType:typeField?.value||'Aucun type particulier'});if(requestCorrection){t.reviewState='Repris en exécution';t.status='En cours'}save();reviewDetail(id);notify(requestCorrection?'Ta demande de correction a été transmise à l’IA.':'Ton message a été ajouté à l’échange avec l’IA.')}function resetReview(id){let t=task(id);if(!t)return;t.reviewState='À examiner par l’agent';save();reviewDetail(id)}function revision(){return head('Révision','Examiner le résultat de chaque action. L’agent contrôle son travail avant de te le soumettre.')+`<p class="note">Chaque action a son propre moment de revue : chaque semaine pour les résultats qui prennent du temps, chaque jour pour les actions dont le résultat arrive rapidement.</p><h2>Actions à réviser</h2><div class="grid">${data.tasks.filter(t=>t.proposalStatus!=='pending').map(reviewCard).join('')}</div><section class="card space" style="margin-top:22px"><h2>Révision des consignes de l’agent</h2><p class="note">Après l’examen des résultats, tu peux ajuster les consignes pour le prochain cycle.</p><label>Structure du script</label><textarea id="promptStructure">${esc(data.prompt.structure)}</textarea><label>Ton / style du projet</label><input id="promptTone" value="${esc(data.prompt.tone)}"><label>Outil ou méthode de production</label><input id="promptVoice" value="${esc(data.prompt.voice)}"><div class="actions">${btn('Simuler la révision des consignes','savePrompt()','primary')}${btn('Réinitialiser les consignes de démonstration','resetPrompt()')}</div></section>`}function savePrompt(){data.prompt={structure:document.getElementById('promptStructure').value,tone:document.getElementById('promptTone').value,voice:document.getElementById('promptVoice').value};data.method=true;save();render();notify('Nouvelle version des consignes enregistrée en simulation.')}function resetPrompt(){data.prompt={structure:'Hook (0–3 s) → problème → conseil concret → conclusion',tone:'Direct, accessible et pédagogique',voice:'Voix française posée et naturelle'};save();render();notify('Consignes de démonstration rétablies.')}

let moneyData=null,moneyFilter='Tous',moneyQuery='',moneyExpand={exp:false,inv:false,corr:false,hist:false,proj:false},moneyGroups={};
function moneyKey(){return 'agent-workspace-money-v2'}

function nb(n){let v=Math.round(n*100)/100;return v.toLocaleString('fr-FR',Number.isInteger(v)?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2})}
function amt(n,c){return nb(n)+' '+c}
function sumFmt(o){let p=Object.keys(o).filter(c=>Math.round(o[c]*100)!==0).map(c=>amt(o[c],c));return p.length?p.join(' + '):'—'}
function addTo(o,c,v){if(v)o[c]=(o[c]||0)+v;return o}
function monthly(e){return e.freq==='mois'?e.amount:e.freq==='an'?e.amount/12:0}
function fdate(d){return d?new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):''}
function monthKey(d){return (d||'').slice(0,7)}
function monthLabel(k){let [y,m]=k.split('-');return new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}
function subsActiveIn(k){return moneyData.expenses.filter(e=>e.freq!=='une fois'&&(!e.since||e.since<=k))}
function rechargesIn(k){return moneyData.expenses.filter(e=>e.freq==='une fois'&&monthKey(e.date)===k)}
function allMonths(){let ks=new Set();moneyData.expenses.forEach(e=>{if(e.freq==='une fois'&&e.date)ks.add(monthKey(e.date));if(e.since)ks.add(e.since)});
 ks.add(new Date().toISOString().slice(0,7));
 let arr=[...ks].sort();let out=[],cur=arr[0],last=arr[arr.length-1];
 while(cur<=last){out.push(cur);let [y,m]=cur.split('-').map(Number);m++;if(m>12){m=1;y++}cur=y+'-'+String(m).padStart(2,'0')}
 return out.reverse()}
function invoiceUpToDate(e){if(!e.invoice)return false;let d=(new Date()-new Date(e.invoice.date))/86400000;return e.freq==='mois'?d<35:e.freq==='an'?d<366:true}

function moneyTiles(){let now=new Date().toISOString().slice(0,7);
 let fixed={},month={},r30={};
 subsActiveIn(now).forEach(e=>{addTo(fixed,e.cur,monthly(e));addTo(month,e.cur,monthly(e))});
 rechargesIn(now).forEach(e=>addTo(month,e.cur,e.amount));
 moneyData.expenses.filter(e=>e.freq==='une fois'&&e.date).forEach(e=>{let d=(new Date()-new Date(e.date))/86400000;if(d>=0&&d<=30)addTo(r30,e.cur,e.amount)});
 let ok=moneyData.expenses.filter(invoiceUpToDate).length;
 let t=[['Ce mois-ci',sumFmt(month),'abonnements + recharges du mois'],['Fixe par mois',sumFmt(fixed),'abonnements et domaines lissés'],['Recharges, 30 derniers jours',sumFmt(r30),'paiements « une fois » récents'],['Factures',ok+' / '+moneyData.expenses.length+' à jour','lignes couvertes par une facture récente']];
 return `<div class="mgrid">${t.map(x=>`<section class="tile"><div class="tiny">${esc(x[0])}</div><strong style="font-size:1.5rem;display:block;margin:8px 0 6px">${esc(x[1])}</strong><div class="tiny">${esc(x[2])}</div></section>`).join('')}</div>`}

  let add=(f.state==='lue'&&!f.match)?btn('Ajouter à la liste',`addFromInvoice('${f.id}')`,'good'):'';
  return `<div class="mrow"><div style="flex:1"><strong>${esc(f.file)}</strong><p style="margin:4px 0 0">${body}</p>${add?'<div class="actions" style="margin-top:8px">'+add+'</div>':''}</div><div style="display:flex;gap:6px">${btn('↻',`notify('Relecture simulée.')`)}${btn('✕',`deleteInvoice('${f.id}')`)}</div></div>`}).join('');
 let more=inv.length>2?`<div class="actions">${btn(moneyExpand.inv?'Voir moins':'Voir '+(inv.length-2)+' facture(s) de plus','toggleMoney("inv")')}</div>`:'';

 return `<section class="tile"><h2 style="margin-top:0">Factures</h2><div class="mdrop"><strong>📎 Dépose tes factures ici</strong><div class="tiny">ou clique pour les choisir · PDF ou photo · 10 Mo max</div><div class="tiny" style="margin-top:6px">Maquette : le dépôt et la lecture automatique demandent une connexion, à brancher plus tard.</div></div>${rows}${more}${corr}<p class="tiny" style="margin-top:12px">Le cerveau lit chaque facture avec Claude (environ 1 centime par facture) et la rapproche de ta liste.</p></section>`}

function moneyExpenses(){let ex=moneyData.expenses.filter(e=>(moneyFilter==='Tous'||e.project===moneyFilter)&&(!moneyQuery||e.name.toLowerCase().includes(moneyQuery.toLowerCase())));
 let groups={};ex.forEach(e=>{let k=e.name.toLowerCase();(groups[k]=groups[k]||[]).push(e)});
 let ord={'mois':0,'an':1,'une fois':2};
 let entries=Object.keys(groups).map(k=>groups[k]).sort((a,b)=>ord[a[0].freq]-ord[b[0].freq]||new Date(b[0].date||'2000-01-01')-new Date(a[0].date||'2000-01-01'));
 let shown=moneyExpand.exp?entries:entries.slice(0,8);
 let rows=shown.map(g=>{
  if(g.length===1){let e=g[0];return expenseRow(e,'')}
  let tot={};g.forEach(e=>addTo(tot,e.cur,e.amount));let open=moneyGroups[g[0].name.toLowerCase()];
  let head=`<tr class="mgrp" onclick="toggleGroup('${g[0].name.toLowerCase().replace(/'/g,"\\'")}')"><td><strong>${open?'▾':'▸'} ${esc(g[0].name)}</strong><br><span class="tiny">${esc([...new Set(g.map(e=>e.project))].join(' · '))}</span></td><td class="r"><strong>${sumFmt(tot)}</strong><br><span class="tiny">${g.length} paiements</span></td><td>dernier : ${fdate(g.map(e=>e.date).filter(Boolean).sort().pop())}</td><td></td><td></td></tr>`;
  return head+(open?g.map(e=>expenseRow(e,'style="opacity:.8"')).join(''):'')}).join('');
 let more=entries.length>8?`<div class="actions">${btn(moneyExpand.exp?'Voir moins':'Voir plus ('+(entries.length-8)+')','toggleMoney("exp")')}</div>`:'';
 let filters=['Tous',...MONEY_PROJECTS].map(p=>`<button class="${moneyFilter===p?'active':''}" onclick="setMoneyFilter('${p.replace(/'/g,"\\'")}')">${esc(p)}</button>`).join('');
 return `<section class="tile"><h2 style="margin-top:0">Dépenses</h2><div class="filters">${filters}</div><input placeholder="Rechercher une dépense…" value="${esc(moneyQuery)}" oninput="setMoneyQuery(this.value)" style="margin:10px 0"><table class="mtbl"><thead><tr><th>Dépense</th><th class="r">Montant</th><th>Quand</th><th>Facture</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5">Aucune dépense.</td></tr>'}</tbody></table>${more}<p class="tiny">Les dépenses du même nom (ex. les recharges Anthropic) sont regroupées : clique sur ▸ pour voir chaque paiement.</p><div class="actions">${btn('+ Ajouter une dépense','addExpense()','good')}</div></section>`}
function expenseRow(e,attr){
 let quand=e.freq==='une fois'?fdate(e.date):(e.date?'prochain : '+fdate(e.date):'<span class="mwarn">date à préciser</span>');
 let inv=!e.invoice?'<span class="mwarn">pas de facture</span>':(invoiceUpToDate(e)?'<span class="mok">✅ '+fdate(e.invoice.date)+'</span>':'<span class="mwarn">⏳ '+fdate(e.invoice.date)+'</span>')+(Math.round(e.invoice.amount*100)!==Math.round(e.amount*100)?` <span class="mwarn tiny">⚠️ ${amt(e.invoice.amount,e.cur)} sur la facture</span>`:'');
 return `<tr ${attr}><td><strong>${esc(e.name)}</strong><br><span class="tiny">${esc(e.project)}</span></td><td class="r">${amt(e.amount,e.cur)}<br><span class="tiny">${e.freq==='une fois'?'une fois':'par '+e.freq}</span></td><td>${quand}</td><td>${inv}</td><td class="r" style="white-space:nowrap">${btn('Modifier',`editExpense('${e.id}')`)}${btn('✕',`removeExpense('${e.id}')`)}</td></tr>`}
// ---------- historique ----------
function moneyHistory(){let months=allMonths(),now=new Date().toISOString().slice(0,7);
 let shown=moneyExpand.hist?months:months.slice(0,3);
 let rows=shown.map(k=>{
  let subs=subsActiveIn(k),rech=rechargesIn(k),tot={};
  let sc=subs.map(e=>{let v=monthly(e);addTo(tot,e.cur,v);return `<div class="mline"><span>${esc(e.name)}</span><span>${amt(v,e.cur)}</span></div>`}).join('')||'<span class="tiny">—</span>';
  let rc=rech.map(e=>{addTo(tot,e.cur,e.amount);return `<div class="mline"><span>${esc(e.name)}</span><span>${amt(e.amount,e.cur)}</span></div>`}).join('')||'<span class="tiny">—</span>';
  return `<tr><td style="vertical-align:top"><strong>${monthLabel(k)}</strong>${k===now?'<br><span class="tiny">en cours</span>':''}</td><td style="vertical-align:top">${sc}</td><td style="vertical-align:top">${rc}</td><td class="r" style="vertical-align:top"><strong>${sumFmt(tot)}</strong></td></tr>`}).join('');
 let year={},all={};
 months.forEach(k=>{subsActiveIn(k).forEach(e=>{addTo(all,e.cur,monthly(e));if(k.startsWith('2026'))addTo(year,e.cur,monthly(e))});rechargesIn(k).forEach(e=>{addTo(all,e.cur,e.amount);if(k.startsWith('2026'))addTo(year,e.cur,e.amount)})});
 let more=months.length>3?`<div class="actions">${btn(moneyExpand.hist?'Voir moins':'Voir '+(months.length-3)+' mois de plus','toggleMoney("hist")')}</div>`:'';
 return `<section class="tile"><h2 style="margin-top:0">Historique</h2><table class="mtbl"><thead><tr><th>Mois</th><th>Abonnements</th><th>Recharges</th><th class="r">Total</th></tr></thead><tbody>${rows}</tbody></table>${more}<p style="margin-top:12px"><strong>2026 : ${sumFmt(year)}</strong> &nbsp;&nbsp; Depuis ${monthLabel(months[months.length-1])} : <strong>${sumFmt(all)}</strong></p><p class="tiny">Rien ne s’efface d’un mois sur l’autre : les recharges restent à leur date, les abonnements comptent chaque mois (domaines lissés sur 12 mois).</p></section>`}

 let rows=shown.map(k=>{
  let cells=used.map(p=>{let list=[...subsActiveIn(k),...rechargesIn(k)].filter(e=>e.project===p),st={};
   let body=list.map(e=>{let v=e.freq==='une fois'?e.amount:monthly(e);addTo(st,e.cur,v);return `<div class="mline"><span>${esc(e.name)}</span><span>${amt(v,e.cur)}</span></div>`}).join('');
   return `<td style="vertical-align:top">${body||'<span class="tiny">—</span>'}${body?`<div class="msub">${sumFmt(st)}</div>`:''}</td>`}).join('');
  return `<tr><td style="vertical-align:top"><strong>${monthLabel(k)}</strong>${k===now?'<br><span class="tiny">en cours</span>':''}</td>${cells}</tr>`}).join('');
 let totals=used.map(p=>{let t={};months.forEach(k=>[...subsActiveIn(k),...rechargesIn(k)].filter(e=>e.project===p).forEach(e=>addTo(t,e.cur,e.freq==='une fois'?e.amount:monthly(e))));return `<td class="r"><strong>${sumFmt(t)}</strong></td>`}).join('');

 if(st&&!st._demo){st._demo=1;st.stopped=true;st.status='En attente de validation Walid';

// ===== Règles décidées : autonomie, couleurs, boucles, leçons =====
function taskAutonomy(t){return t.autonomy||(t.proposalStatus==='pending'?'à valider':'première fois à valider')}
function isStopped(t){return !!t.stopped}
// une idée est rouge si elle attend Walid
function ideaIsRed(i){if(!i||typeof i==='string')return false;if(i.source==='IA'&&i.approvalStatus==='pending')return true;if((i.accessRequests||[]).some(a=>!a.connected))return true;if(i.errorState)return true;return false}
function taskColor(t){
 if(t.status==='En pause')return 'gris';
 if(t.proposalStatus==='pending')return 'rouge';
 if(isStopped(t))return 'rouge';
 if((t.ideas||[]).some(ideaIsRed))return 'rouge';
 if(t.status==='En attente de validation Walid')return 'rouge';
 return 'vert'}
function projectColor(d){let ts=d.tasks||[];if(ts.some(t=>taskColor(t)==='rouge'))return 'rouge';if(ts.length&&ts.every(t=>taskColor(t)==='gris'))return 'gris';return 'vert'}
function colorDot(c){let m={rouge:'#e06c6c',vert:'#5fbf7d',gris:'#8a8a8a'};return `<span class="cdot" style="background:${m[c]}" title="${c==='rouge'?'Quelque chose t’attend':c==='gris'?'En pause':'Rien à faire'}"></span>`}
function projectColorFor(id){try{let raw=localStorage.getItem(projectKey(id));let d=raw?JSON.parse(raw):projectDefaults(id);if(!d.tasks)d=projectDefaults(id);let p=projects.find(x=>x.id===id);let tasks=d.tasks.slice();permanentLoops(id,p?p.name:'').forEach(s=>{if(!tasks.some(t=>t.id===s.id))tasks.push(s)});return projectColor({tasks})}catch{return 'vert'}}
// étapes concernées par une action
function stagesFor(t){
 if(t.type==='Ponctuelle'&&t.done)return ['verification','memoire','revision'];
 return ['planification','execution','verification','memoire','priorites','revision']}
function showsOn(t,slug){return stagesFor(t).includes(slug)}
function currentSlug(){let s=location.hash.slice(1);return slugs.includes(s)?s:'planification'}
function visibleTasks(slug){return data.tasks.filter(t=>showsOn(t,slug))}
// bandeau d'état posé sur la carte
function autonomyBadge(t){
 if(t.status==='En pause')return '<span class="badge">En pause</span>';
 let a=taskAutonomy(t);
 return a==='autonome'?'<span class="badge green">Autonome</span>':'<span class="badge gold">Première fois à valider</span>'}
function stopBanner(t){if(!isStopped(t))return '';
 return `<section class="strip red"><strong>Action arrêtée — en attente de ta décision</strong><p>${esc(t.stopReason||'Une modification a été proposée : l’action ne reprend qu’après ta validation.')}</p><div class="actions">${btn('✅ Valider la modification',`approveChange('${t.id}')`,'good')}${btn('❌ Refuser et reprendre l’ancienne version',`rejectChange('${t.id}')`,'danger')}</div></section>`}
function approveChange(id){let t=task(id);if(!t)return;t.stopped=false;t.stopReason='';t.autonomy='autonome';t.status='En cours';(t.reviewHistory=t.reviewHistory||[]).unshift({date:new Date().toISOString().slice(0,10),finding:'Modification validée par Walid.',decision:'L’action repart et redevient autonome.'});save();render();notify('Modification validée, l’action repart.')}
function rejectChange(id){let t=task(id);if(!t)return;t.stopped=false;t.stopReason='';t.status='En cours';(t.reviewHistory=t.reviewHistory||[]).unshift({date:new Date().toISOString().slice(0,10),finding:'Modification refusée par Walid.',decision:'L’ancienne version reprend.'});save();render();notify('Modification refusée, l’ancienne version reprend.')}
function grantAutonomy(id){let t=task(id);if(!t)return;t.autonomy='autonome';save();render();notify('Cette action tourne désormais seule.')}
function revokeAutonomy(id){let t=task(id);if(!t)return;t.autonomy='première fois à valider';save();render();notify('Autonomie retirée : l’action attendra ta validation.')}
// proposition façon bras droit
function proposalCard(t){if(t.proposalStatus!=='pending')return t.proposalStatus==='approved'?`<p class="note green">Action validée par Walid · elle tourne seule désormais.</p>`:'';
 let p=t.brief||{};
 return `<section class="strip red"><strong>Proposition de l’agent</strong>
 <div class="brief"><div><span>Ce que j’ai observé</span>${esc(p.observed||t.proposalReason||'Observation non précisée.')}</div>
 <div><span>Ce que j’en déduis <em>(hypothèse)</em></span>${esc(p.hypothesis||'À confirmer sur un volume plus large.')}</div>
 <div><span>Ce que je propose</span>${esc(p.proposal||t.goal)}</div>
 <div><span>Ce que ça change</span>${esc(p.effect||'Effet attendu à mesurer au prochain tour.')}</div>
 <div><span>Si on ne fait rien</span>${esc(p.ifNothing||'La situation reste en l’état.')}</div></div>
 <div class="actions">${btn('✅ Valider l’action',`setTaskProposal('${t.id}',true)`,'good')}${btn('❌ Refuser',`setTaskProposal('${t.id}',false)`,'danger')}</div></section>`}
// leçons : statut
const LESSON_STATES=['à tester','confirmée','invalidée'];
function lessonState(m){return m.state||'à tester'}
function setLessonState(taskId,idx,st){let list=(data.memories||[]).filter(m=>m.taskId===taskId);let m=list[idx];if(m){m.state=st;save();render();notify('Leçon marquée « '+st+' ».')}}

function render(){if(!moneyData)moneyData=loadMoney();applyDemoStates();let hash=location.hash.slice(1);let isMoney=hash===moneyPage.slug;let idx=slugs.indexOf(hash);page=idx<0?0:idx;document.getElementById('nav').innerHTML=pages.map((p,i)=>`<a href="#${slugs[i]}" class="${(!isMoney&&i===page)?'active':''}"><span class="num">0${i+1}</span>${p}</a>`).join('')+`<a href="#${moneyPage.slug}" class="${isMoney?'active':''}" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px"><span class="num">€</span>${moneyPage.name}</a>`;document.getElementById('breadcrumb').textContent=isMoney?moneyPage.name:pages[page];if(isMoney){document.getElementById('activeProject').textContent=projectDef.name;main.innerHTML=moneyPageHtml();return}document.getElementById('activeProject').textContent=projectDef.name;main.innerHTML=[planning,execution,verification,memory,priorities,revision][page]()+`<details style="margin-top:32px;border-top:1px solid var(--line);padding-top:18px"><summary style="cursor:pointer;color:var(--gold)">Une remarque sur cette page ?</summary><p class="note">Tes remarques restent liées à cette étape.</p><textarea placeholder="Il manque… / Je voudrais voir…" oninput="note(this.value)">${esc(data.notes[page]||'')}</textarea><div class="actions">${btn('Télécharger mes remarques','downloadNotes()')}</div></details><div class="page-bottom">${page?btn('← '+pages[page-1],`go(${page-1})`):'<span></span>'}${page<5?btn(pages[page+1]+' →',`go(${page+1})`):btn('Retour à la planification ↻','go(0)')}</div><p class="tiny" style="margin-top:18px">Maquette interactive · Données de démonstration fictives, conservées dans ce navigateur · Agents, outils et publication simulés.</p>`}function setCategory(f){categoryFilter=f;render()}function setSource(f){sourceFilter=f;render()}function downloadNotes(){let content=pages.map((p,i)=>`## ${p}\n${data.notes[i]||''}`).join('\n\n');download('remarques-chaine-youtube.md',content,'text/markdown')}function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});save();render();
</script></body></html>
